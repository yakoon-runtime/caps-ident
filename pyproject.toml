[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "y5n-caps-ident"
version = "0.8.0"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Stefan Bergmann" }]
dependencies = ["y5n-runtime-api", "y5n-sdk-python", "y5n-runtime-store", "y5n-runtime-engine"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"y5n.caps.ident" = ["*.ydf", "**/*.ydf"]
"y5n.caps.ident.resources" = ["*.ydf", "**/*.ydf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
